<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LeadBot - Jobs for this work-seeker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#0b0b1a;--bg2:#12122a;--card:rgba(255,255,255,.045);--card-solid:#16163a;--line:rgba(255,255,255,.09);
  --text:#f1f1fb;--muted:#9a9cc0;--violet:#8b5cf6;--pink:#ec4899;--orange:#fb923c;--cyan:#22d3ee;--green:#34d399;--amber:#fbbf24;--red:#f87171;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 55%,#fb923c 100%);
  --glow:0 10px 40px -10px rgba(139,92,246,.55);
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#f5f3ff;--bg2:#fdf2f8;--card:rgba(255,255,255,.8);--card-solid:#fff;--line:rgba(76,29,149,.1);
  --text:#1e1b3a;--muted:#6b6890;--glow:0 10px 30px -12px rgba(139,92,246,.45);--green:#059669;--amber:#b45309;--red:#dc2626;--cyan:#0891b2}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 15% 10%,rgba(139,92,246,.28),transparent 70%),
             radial-gradient(35% 30% at 90% 20%,rgba(236,72,153,.22),transparent 70%),
             radial-gradient(40% 35% at 70% 95%,rgba(251,146,60,.16),transparent 70%);
  animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) rotate(6deg)}}
a{color:inherit}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* lock */
#lock{position:fixed;inset:0;display:grid;place-items:center;z-index:50;padding:16px;background:var(--bg)}
#lock::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:var(--grad);filter:blur(120px);opacity:.35;animation:pulse 6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.5}}
#lock form{position:relative;width:100%;max-width:360px;padding:32px 28px;border-radius:24px;background:var(--card-solid);border:1px solid var(--line);box-shadow:var(--glow);display:flex;flex-direction:column;gap:14px;text-align:center}
.logo{width:56px;height:56px;margin:0 auto;border-radius:16px;background:var(--grad);display:grid;place-items:center;box-shadow:var(--glow)}
.logo svg{width:30px;height:30px}
#lock h2{margin:0;font-size:26px;font-weight:800}
#err{color:var(--red);font-size:13px;min-height:18px}
input,select{font:inherit;color:var(--text);background:var(--card-solid);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;color:#fff;background:var(--grad);box-shadow:var(--glow);transition:transform .15s,filter .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn.ghost{background:var(--card-solid);color:var(--text);border:1px solid var(--line);box-shadow:none}
label.chk{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:13px}

/* layout */
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(11,11,26,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) header{background:rgba(245,243,255,.78)}}
header .logo{width:36px;height:36px;border-radius:11px;margin:0}header .logo svg{width:20px;height:20px}
header h1{font-size:20px;font-weight:800;margin:0}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
header .sp{flex:1}
main{max-width:1440px;margin:0 auto;padding:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(8px)}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:18px}
.kpi{position:relative;overflow:hidden;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .2s,border-color .2s;animation:rise .6s both}
.kpi:hover{transform:translateY(-3px);border-color:var(--c)}
.kpi.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:var(--c);opacity:.14;filter:blur(8px)}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);margin-bottom:10px}
.kpi .ic svg{width:18px;height:18px}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}
.kpi span{color:var(--muted);font-size:12px;font-weight:600}
.kpi small{position:absolute;right:14px;bottom:14px;font-size:11px;font-weight:700;color:var(--c)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

.charts{display:grid;grid-template-columns:1fr 1fr 300px;gap:14px;margin-bottom:18px}
.chart{padding:18px}
.chart h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;justify-content:space-between}
.chart h3 span{color:var(--muted);font-weight:600;font-size:12px}
.bar{display:grid;grid-template-columns:120px 1fr 52px;align-items:center;gap:10px;margin:7px 0;cursor:pointer;font-size:12.5px}
.bar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-weight:600}
.bar:hover .lbl,.bar.on .lbl{color:var(--text)}
.bar .trk{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:var(--grad);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.on .fill{background:linear-gradient(90deg,var(--cyan),var(--green))}
.bar .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.donut{width:170px;height:170px;margin:4px auto 14px;border-radius:50%;position:relative;transition:background .6s}
.donut::after{content:"";position:absolute;inset:22px;border-radius:50%;background:var(--card-solid)}
.donut div{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center}
.donut b{font-size:28px;font-weight:800;display:block;line-height:1}.donut span{font-size:11px;color:var(--muted)}
.legend{display:grid;gap:6px;font-size:12px}
.legend div{display:flex;align-items:center;gap:8px}.legend i{width:10px;height:10px;border-radius:3px}.legend em{margin-left:auto;font-style:normal;font-weight:700}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:14px;margin-bottom:10px;align-items:center}
.search{position:relative;flex:1 1 260px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input{width:100%;padding-left:36px}
.toolbar select{flex:0 1 170px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 2px 12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--violet) 18%,transparent);border:1px solid color-mix(in srgb,var(--violet) 40%,transparent);cursor:pointer}
.chip:hover{border-color:var(--pink)}
.chip.clear{background:transparent;border-color:var(--line);color:var(--muted)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0}
th{position:sticky;top:0;text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:var(--text)}th.s::after{content:" ↓"}th.s.up::after{content:" ↑"}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{animation:fade .35s both;transition:background .15s}
tbody tr:hover{background:color-mix(in srgb,var(--violet) 8%,transparent)}
@keyframes fade{from{opacity:0;transform:translateX(-6px)}}
.biz{display:flex;gap:12px;align-items:center;min-width:240px}
.av{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
.biz b{display:block;font-weight:700}.biz b a{text-decoration:none}.biz b a:hover{color:var(--pink)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-top:3px}
.site{font-size:11.5px;color:var(--muted);margin-left:6px;text-decoration:none}.site:hover{color:var(--cyan)}
.ph{white-space:nowrap;text-decoration:none;font-weight:600;font-variant-numeric:tabular-nums}.ph:hover{color:var(--cyan)}
.em{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;max-width:260px}
.em span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{flex:none;font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;letter-spacing:.03em}
.st.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.st.pers{background:color-mix(in srgb,var(--cyan) 18%,transparent);color:var(--cyan)}
.st.warn{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.st.bad{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.none{color:var(--muted);font-size:12px}
.socs{display:flex;gap:6px}
.so{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;text-decoration:none;transition:transform .15s}
.so:hover{transform:scale(1.15) rotate(-4deg)}
.stars{color:var(--amber);font-weight:700;white-space:nowrap}.stars small{color:var(--muted);font-weight:600;margin-left:4px}
.src{font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}

.tabs{display:flex;gap:6px;margin-left:10px}
.tab{font:inherit;font-weight:700;font-size:13px;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);background:var(--card);border-color:var(--line);box-shadow:var(--glow)}
.lead-def{margin:0 0 14px;padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--violet) 12%,transparent);border:1px solid color-mix(in srgb,var(--violet) 30%,transparent);color:var(--text);font-size:13px}
.kpis4{grid-template-columns:repeat(4,1fr)}
.bcard{display:grid;grid-template-columns:64px 1fr auto;gap:14px;padding:16px;border-bottom:1px solid var(--line);align-items:start;animation:fade .35s both;transition:background .15s}
.bcard:hover{background:color-mix(in srgb,var(--violet) 7%,transparent)}
.bscore{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff}
.bscore small{display:block;font-size:9px;font-weight:700;letter-spacing:.06em;opacity:.85;margin-top:-2px}
.btitle{font-weight:700;font-size:15px;line-height:1.35}
.bmeta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;font-size:11.5px;font-weight:600;color:var(--muted);align-items:center}
.bchip{padding:2px 8px;border-radius:99px;font-weight:700;font-size:11px}
.bsnip{color:var(--muted);font-size:13px;line-height:1.45;max-width:780px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bright{display:flex;flex-direction:column;gap:6px;align-items:flex-end;text-align:right;white-space:nowrap}
.bval{font-weight:800;font-size:16px;color:var(--green)}
.bgo{text-decoration:none}
.fit{min-width:118px}
.tier{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:11px;letter-spacing:.05em;padding:3px 9px 3px 7px;border-radius:99px}
.tier i{width:7px;height:7px;border-radius:50%;background:currentColor}
.tier.HOT{background:color-mix(in srgb,#fb923c 22%,transparent);color:#fb923c}
.tier.HOT i{box-shadow:0 0 0 0 rgba(251,146,60,.7);animation:ping 2s infinite}
.tier.WARM{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
.tier.COLD{background:color-mix(in srgb,var(--cyan) 16%,transparent);color:var(--cyan)}
.tier em{font-style:normal;font-variant-numeric:tabular-nums;opacity:.85}
.why{margin-top:4px;font-size:11px;color:var(--muted);line-height:1.35;max-width:210px}
.offerlbl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;color:var(--muted);white-space:nowrap}
.offerlbl select{border-color:color-mix(in srgb,var(--pink) 55%,var(--line));font-weight:700}
.pager{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:14px}
.pager .n{color:var(--muted);font-weight:600}
.pager .btns{display:flex;gap:8px;align-items:center}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:var(--card-solid);border:1px solid var(--line);box-shadow:var(--glow);padding:12px 18px;border-radius:14px;font-weight:700;transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:60}
.toast.show{transform:translate(-50%,0)}

@media (max-width:720px){.bcard{grid-template-columns:48px 1fr;gap:10px}.bscore{width:46px;height:46px;font-size:17px}.bright{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;text-align:left}.kpis4{grid-template-columns:repeat(2,1fr)}.tabs{margin-left:0}header{flex-wrap:wrap}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.charts{grid-template-columns:1fr 1fr}.charts .donutc{grid-column:1/-1}}
@media (max-width:720px){
  main{padding:14px 16px}header{padding:10px 16px}header .pill.hide-sm{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}.kpi b{font-size:22px}
  .charts{grid-template-columns:1fr}.bar{grid-template-columns:96px 1fr 44px}
  .toolbar select{flex:1 1 45%}
  thead{display:none}table,tbody,tr,td{display:block}
  tbody tr{border-bottom:1px solid var(--line);padding:12px 4px}
  td{border:0;padding:4px 10px}
  td[data-l]::before{content:attr(data-l);display:inline-block;width:70px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
}
#tendbox:not([hidden]){display:contents}

.jhead{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:18px 20px;margin-bottom:14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.jhead h2{margin:0 0 4px;font-size:20px}
.jhead .sub{color:var(--muted);font-size:13px;font-weight:600}
.jwho{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.jwho a{font-size:12.5px;font-weight:700;text-decoration:none;padding:5px 11px;border-radius:99px;background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--text)}
.jback{text-decoration:none;display:inline-block}
</style>
</head>
<body>
<div id="lock"><form id="lockform">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6M11 8v6"/></svg></div>

  <span class="sp"></span>

</main>

<script>
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago = d => { const t = Date.parse(d); if (!t) return ""; const m = Math.max(0, (Date.now() - t) / 60000);
  return m < 60 ? Math.round(m) + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; };
const VLABEL = {plumber:"Plumber", electrician:"Electrician", roofer:"Roofer", hvac:"HVAC / furnace", painter:"Painter", landscaper:"Landscaping / yard",
  cleaner:"Cleaning service", mover:"Movers", renovator:"Renovation / contractor", realtor:"Realtor", mortgage:"Mortgage broker", dentist:"Dentist",
  lawyer:"Lawyer", accountant:"Accountant / tax", insurance:"Insurance broker", web:"Web / marketing", auto:"Auto repair", pest:"Pest control",
  events:"Events / photo / catering", locksmith:"Locksmith", junk:"Junk removal", appliance:"Appliance repair", vet_pet:"Vet / pet services",
  fitness:"Fitness / coach", childcare:"Childcare / tutoring", mkt:"Social media & digital marketing", website:"Website services", lifeins:"Life insurance", mortrenew:"Mortgage renewal / shopping around", newcomer:"Newcomer to Canada", debt:"Debt / CRA / back-tax trouble", elder:"Aging parent / estate planning", divorce:"Separation / divorce", selftax:"Self-employed / gig-worker taxes", bizcra:"Small-business CRA trouble (GST/HST, payroll)", landlord:"Landlord / tenant dispute", homeins:"Home / auto insurance shopping", lifeevent:"Life insurance - life event (not asked yet)", affiliate:"Affiliate marketing", ai:"AI & automation", menopause:"Menopause products & advice", b2b:"Other business services", beauty:"Hair / beauty / tattoo", therapy:"Therapist / counsellor", repair:"Repair / refinishing", tech:"IT / smart home"};
Object.assign(VLABEL, {framer: "Framer / framing", drywaller: "Drywall / taping", mason: "Masonry / concrete", flooring: "Flooring / tile", siding: "Siding / windows / insulation",
  excavation: "Excavation / demolition / paving", welder: "Welder / metal fabrication", carpenter: "Carpenter / finish carpentry"});
const PARENT = {carpenter: "renovator", framer: "renovator", drywaller: "renovator", mason: "renovator", flooring: "renovator", siding: "renovator", excavation: "renovator", welder: "renovator"};
const PROVN = {AB: "Alberta", BC: "British Columbia", MB: "Manitoba", NB: "New Brunswick", NL: "Newfoundland & Labrador", NS: "Nova Scotia", NT: "Northwest Territories", NU: "Nunavut",
  ON: "Ontario", PE: "Prince Edward Island", QC: "Quebec", SK: "Saskatchewan", YT: "Yukon"};
const SRC = {reddit: "asked online", permit: "project starting", tender: "government tender", newbiz: "new business"};
const qs = new URLSearchParams(location.search);
const T = qs.get("t") || "", C = qs.get("c") || "", P = qs.get("p") || "", WHO = qs.get("n") || "", PH = qs.get("ph") || "", EM = qs.get("em") || "";
let BUY = [], VIEW = [];

async function decrypt(pw, file) {
  const blob = await (await fetch(file + "?v=" + Date.now())).json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(blob.salt), iterations:blob.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(blob.iv)}, key, b64(blob.ct));
  return JSON.parse(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}
async function unlock(pw, remember) {
  $("err").textContent = "Unlocking…";
  let d;
  try { d = await decrypt(pw, "intent.enc.json"); }
  catch (e) {
    $("err").textContent = (e && e.name === "OperationError") ? "Wrong password." : "Could not load. Check your connection and try again.";
    if (e && e.name === "OperationError") { try { localStorage.removeItem("lb_pw"); sessionStorage.removeItem("lb_pw"); } catch (e2) {} }
    return;
  }
  try { sessionStorage.setItem("lb_pw", pw); remember ? localStorage.setItem("lb_pw", pw) : localStorage.removeItem("lb_pw"); } catch (e) {}
  BUY = d.leads || [];
  $("upd").textContent = "Updated " + d.updated;
  $("lock").style.transition = "opacity .4s"; $("lock").style.opacity = 0; setTimeout(() => $("lock").remove(), 400);
  init();
}
$("lockform").onsubmit = e => { e.preventDefault(); unlock($("pw").value, $("remember").checked); };
try { const ls = localStorage.getItem("lb_pw"), s = ls || sessionStorage.getItem("lb_pw"); if (s) unlock(s, !!ls); } catch (e) {}

const isTrade = r => r.v === T || (r.tags || []).includes(T) || (PARENT[T] && (r.v === PARENT[T] || (r.tags || []).includes(PARENT[T])));
function apply() {
  const scope = $("j-scope").value, more = $("j-more").checked, sort = $("j-sort").value;
  VIEW = BUY.filter(r => isTrade(r) && (more ? true : r.src === "reddit")
      && (scope === "all" || (scope === "prov" ? (r.p === P || (!P && true)) : (C ? (r.c || "").toLowerCase() === C.toLowerCase() : r.p === P))));
  VIEW.sort((a, b) => sort === "new" ? (Date.parse(b.d) || 0) - (Date.parse(a.d) || 0) : (b.sc - a.sc) || (Date.parse(b.d) || 0) - (Date.parse(a.d) || 0));
  render();
}
function link(r) {
  return (r.src === "reddit" || r.src === "tender") ? r.u : r.src === "newbiz" ? "https://www.google.com/search?q=" + encodeURIComponent(`${r.t} ${r.c} ${r.p}`)
    : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(`${r.addr || ""}, ${r.c}, ${r.p}`);
}
function render() {
  const scope = $("j-scope").value;
  const where = scope === "all" ? "Canada" : scope === "prov" ? (PROVN[P] || P || "their province") : (C || PROVN[P] || "their area");
  $("jtitle").textContent = `${VIEW.length.toLocaleString()} job${VIEW.length === 1 ? "" : "s"} for ${VLABEL[T] || T || "this trade"} in ${where}`;
  $("jsub").textContent = $("j-more").checked ? "People asking for this trade, plus projects starting and government tenders." : "People who asked online for this trade (Reddit, Kijiji, Craigslist, forums).";
  $("jwho").innerHTML = WHO ? `<span style="font-weight:700">Connect:</span> <b>${esc(WHO)}</b>` + (PH ? `<a href="tel:${esc(PH.replace(/\D/g, ""))}">📞 ${esc(PH)}</a>` : "") + (EM ? `<a href="mailto:${esc(EM)}">✉ ${esc(EM)}</a>` : "") : "";
  $("jlist").innerHTML = VIEW.length ? VIEW.map((r, i) => {
    const isR = r.src === "reddit", isT = r.src === "tender";
    const col = r.sc >= 75 ? "linear-gradient(135deg,#34d399,#22d3ee)" : r.sc >= 62 ? "linear-gradient(135deg,#fb923c,#ec4899)" : "linear-gradient(135deg,#8b5cf6,#22d3ee)";
    const contact = [r.cph ? `<a href="tel:${esc(String(r.cph).replace(/\D/g, ""))}">📞 ${esc(r.cph)}</a>` : "", r.ce ? `<a href="mailto:${esc(r.ce)}">✉ ${esc(r.ce)}</a>` : ""].join(" ");
    return `<div class="bcard"><div class="bscore" style="background:${col}"><div>${r.sc}<small>MATCH</small></div></div>
      <div><div class="btitle">${esc(r.t)}</div>
        <div class="bmeta"><span class="bchip" style="background:#8b5cf622;color:#a78bfa">${esc(VLABEL[r.v] || r.v)}</span><span>📍 ${esc(r.c || PROVN[r.p] || "Canada")}${r.c && r.p ? ", " + esc(r.p) : ""}</span>
          <span>🕒 ${esc(ago(r.d))}</span><span>${isR ? "💬 " + esc(r.sub || "asked online") : isT ? "🏛️ " + esc(r.ent || "tender") + (r.close ? " · closes " + esc(r.close) : "") : esc(SRC[r.src] || r.src)}</span>
          ${r.val ? `<span style="color:#34d399">$${Math.round(r.val).toLocaleString()}</span>` : ""}</div>
        ${r.s && r.s !== r.t ? `<div class="bsnip">${esc(r.s)}</div>` : ""}
        ${contact ? `<div class="bmeta">${contact}</div>` : ""}</div>
      <div class="bright"><a class="btn bgo" href="${esc(link(r))}" target="_blank" rel="noopener">${isR ? "Open post ↗" : isT ? "Open tender ↗" : "View ↗"}</a></div></div>`;
  }).join("") : '<div style="padding:40px;text-align:center;color:var(--muted)">No matching jobs in this area yet. Try “Anywhere in their province”.</div>';
  $("jcount").textContent = `${VIEW.length.toLocaleString()} jobs`;
}
function exportCsv() {
  const cols = [["sc","match"],["t","title"],["v","trade asked"],["c","city"],["p","province"],["d","posted"],["src","source"],["cph","contact phone"],["ce","contact email"],["u","link"],["s","details"]];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = [cols.map(c => c[1]).join(","), ...VIEW.map(r => cols.map(c => q(r[c[0]])).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], {type: "text/csv"}));
  a.download = `jobs_${(T || "trade")}_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}
function init() {
  $("j-scope").value = qs.get("scope") || (C ? "city" : "prov");
  ["j-scope", "j-sort", "j-more"].forEach(id => $(id).addEventListener("change", apply));
  $("j-csv").onclick = exportCsv;
  apply();
}
</script>
