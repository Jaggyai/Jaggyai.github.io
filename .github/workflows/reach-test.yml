name: reach-test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://www.reddit.com/r/Calgary/new.rss?limit=5" "https://www.reddit.com/r/smallbusiness/new.rss?limit=5" "https://html.duckduckgo.com/html/?q=test" "https://data.calgary.ca/resource/c2es-76ed.json?\$limit=1" "https://canadabuys.canada.ca/opendata/pub/openTenderNotice-ouvertAvisAppelOffres.csv"; do
            echo "$(curl -s -o /dev/null -m 40 -w '%{http_code}' -A 'Mozilla/5.0 LeadBot/1.0' "$u") $u"
          done
